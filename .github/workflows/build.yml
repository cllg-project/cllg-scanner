name: Build CLLG Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            eb_platform: linux
          - os: windows-latest
            eb_platform: win
          - os: macos-latest
            eb_platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: npm ci

      # libfuse2 is needed for electron-builder to BUILD an AppImage on Linux
      # (not just for end users to run one) — modern Ubuntu runners ship FUSE3 only.
      - name: Install AppImage build dependencies
        if: matrix.eb_platform == 'linux'
        run: sudo apt-get install -y libfuse2

      - name: Build app
        run: npm run build

      - name: Package (electron-builder)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9] ]]; then
            VERSION="$TAG"
          else
            VERSION="0.0.1"
          fi
          npx electron-builder --${{ matrix.eb_platform }} --publish never \
            --config.extraMetadata.version="$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cllg-desktop-${{ matrix.eb_platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      # For resources/models.json and the scripts that check the models against it.
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      # The Kraken models are not packaged in the app: they are attached to each release
      # and downloaded by the app on first run. They live in their own repository (Git
      # LFS) and are taken from its release pinned in resources/models.json, checked
      # against the manifest.
      - name: Attach the Kraken models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="$(node -p "require('./resources/models.json').modelsRepo")"
          TAG="$(node -p "require('./resources/models.json').modelsTag")"
          gh release download "$TAG" --repo "$REPO" --dir artifacts/models \
            $(node scripts/model-manifest.mjs list | sed 's/^/--pattern /')
          node scripts/model-manifest.mjs verify artifacts/models

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
