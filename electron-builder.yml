appId: com.cllg.desktop
productName: CLLG Desktop
copyright: Built by Inria — ALMAnaCH Team, under Apache License 2.0
afterPack: afterPack.js

directories:
  output: dist

files:
  - out/**/*
  - node_modules/**/*
  - '!**/.git/**'

asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/kraken-js/**
  - node_modules/sharp/**
  - node_modules/@img/**

# The Kraken models are not packaged: they are attached to the GitHub release and
# downloaded on first run (src/main/models.ts, resources/models.json).
extraResources:
  - from: licenses/
    to: licenses/

win:
  target:
    - target: portable
      arch:
        - x64
  icon: cllg.ico

mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: cllg.ico
  category: public.app-category.developer-tools

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  icon: cllg.png
  category: Utility
  maintainer: "Thibault Clérice <leponteineptique@gmail.com>"

deb:
  afterInstall: scripts/deb-after-install.sh
